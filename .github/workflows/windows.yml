name: build-windows
# Compila Trazo.exe (no requiere Python en la PC destino).
#  - push a main / ejecución manual: artefacto descargable en la pestaña Actions
#  - etiqueta v*: además publica un Release con Trazo-windows.zip
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -e .[dev]
      - name: Pruebas
        run: python -m pytest -q tests
      - name: Compilar ejecutable
        run: >
          pyinstaller --noconfirm --clean --name Trazo --console
          --icon docs\marca\trazo.ico
          --add-data "trazo\web;trazo\web"
          --collect-all skimage --collect-all HersheyFonts --collect-data ezdxf
          --collect-submodules uvicorn trazo\__main__.py
      - name: Probar ejecutable
        shell: pwsh
        env:
          TRAZO_HOME: ${{ runner.temp }}\trazo-home
        run: |
          dist\Trazo\Trazo.exe profiles
          dist\Trazo\Trazo.exe tests\data\sample.svg -o "$env:RUNNER_TEMP\s.gcode"
          dist\Trazo\Trazo.exe tests\data\sample.dxf -o "$env:RUNNER_TEMP\d.gcode"
          dist\Trazo\Trazo.exe tests\data\logo.png --colors 2 -o "$env:RUNNER_TEMP\l.gcode"
          dist\Trazo\Trazo.exe tests\data\foto.jpg --raster-mode hatch -o "$env:RUNNER_TEMP\f.gcode"
          if (!(Test-Path "$env:RUNNER_TEMP\f.gcode")) { exit 1 }
      - name: Empaquetar
        shell: pwsh
        run: |
          Copy-Item README.md dist\Trazo\LEEME.md
          Compress-Archive -Path dist\Trazo -DestinationPath Trazo-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Trazo-windows
          path: Trazo-windows.zip
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} Trazo-windows.zip --title "Trazo ${{ github.ref_name }}" --notes "Descomprima Trazo-windows.zip y ejecute Trazo\Trazo.exe (no requiere Python)."
