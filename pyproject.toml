[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trazo"
version = "0.2.0"
description = "Generador de G-code para plotter de pluma sobre impresoras 3D (Ender 3 y similares)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "shapely>=2.0",
  "ezdxf>=1.1",
  "svgelements>=1.9",
  "pillow>=10",
  "scikit-image>=0.21",
  "potracer>=0.0.4",
  "Hershey-Fonts>=2.1",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "pyinstaller"]

[project.scripts]
trazo = "trazo.cli:main"

[tool.setuptools.packages.find]
include = ["trazo*"]

[tool.setuptools.package-data]
trazo = ["web/*"]

[tool.ruff]
line-length = 120
