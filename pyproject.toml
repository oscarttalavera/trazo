[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trazo"
version = "0.3.0"
description = "Generador de G-code para plotter de pluma sobre impresoras 3D (Ender 3 y similares)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "shapely>=2.0",
  "ezdxf>=1.1",
  "svgelements>=1.9",
  "pillow>=10",
  "potracer>=0.0.4",
  "Hershey-Fonts>=2.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "build"]

[project.scripts]
trazo = "trazo.cli:main"

[tool.setuptools.packages.find]
include = ["trazo*"]


[tool.ruff]
line-length = 120
